<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}FasalClaim Sandbox{% endblock %}</title>
<style>
  :root { --ink:#1d2a24; --muted:#5d6b63; --line:#cfd8d2; --bg:#f4f6f3; --card:#ffffff; --accent:#1f6f54; --warn-bg:#fff4d6; --warn-ink:#6b4a00; --err:#a3281f; }
  * { box-sizing: border-box; }
  body { margin:0; font:16px/1.5 system-ui, "Segoe UI", Arial, sans-serif; color:var(--ink); background:var(--bg); }
  .sandbox { background:var(--warn-bg); color:var(--warn-ink); padding:10px 16px; font-weight:600; text-align:center; border-bottom:1px solid #e6cf8a; }
  header { background:var(--accent); color:#fff; padding:14px 16px; }
  header a { color:#fff; text-decoration:none; font-size:20px; font-weight:700; }
  header span { opacity:.85; margin-left:10px; font-size:14px; }
  main { max-width:760px; margin:24px auto; padding:0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:22px; }
  h1 { font-size:24px; margin:0 0 4px; } h2 { font-size:18px; margin:0 0 16px; color:var(--muted); font-weight:500; }
  .steps { display:flex; gap:8px; margin:0 0 18px; padding:0; list-style:none; font-size:14px; }
  .steps li { padding:4px 10px; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
  .steps li.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .field { margin:0 0 14px; } label { display:block; font-weight:600; margin-bottom:4px; }
  input[type=text], input[type=tel], input[type=number], input[type=date], input[type=time], select, textarea
    { width:100%; padding:9px 10px; border:1px solid #9aa8a0; border-radius:6px; font:inherit; background:#fff; }
  textarea { min-height:80px; }
  .radio label, .check label { display:inline; font-weight:400; margin-left:6px; }
  .radio div { margin-bottom:4px; }
  button, .btn { display:inline-block; background:var(--accent); color:#fff; border:0; border-radius:6px; padding:10px 18px; font:inherit; font-weight:600; cursor:pointer; text-decoration:none; }
  .errors { background:#fdecea; border:1px solid #f0b4ad; color:var(--err); border-radius:6px; padding:10px 14px; margin-bottom:16px; }
  .ref { font-size:30px; font-weight:800; letter-spacing:1px; color:var(--accent); }
  table { width:100%; border-collapse:collapse; font-size:14px; } th, td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); }
  .muted { color:var(--muted); font-size:14px; }
  dl { display:grid; grid-template-columns: 180px 1fr; gap:4px 12px; margin:16px 0 0; } dt { color:var(--muted); } dd { margin:0; }
</style>
</head>
<body>
<div class="sandbox" id="sandbox-banner">Demo sandbox — not a government website. All data is fictional.</div>
<header><a href="/">FasalClaim Sandbox</a><span>crop-loss reporting test portal</span></header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
